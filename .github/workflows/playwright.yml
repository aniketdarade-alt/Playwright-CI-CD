name: Playwright Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Running window2 specific tests
  window2-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps
      - name: Run Window2 Tests
        run: pytest -m window2 --tracing=retain-on-failure

  # Job 2: Running a different set of tests (e.g., Smoke Tests)
  smoke-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps
      - name: Run Smoke Tests
        run: pytest -m window --tracing=retain-on-failure